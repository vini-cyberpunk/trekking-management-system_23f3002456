{% extends "staff/staff_base.html" %}

{% block title %}
My Profile
{% endblock %}


{% block main_content %}


<h2>

    My Profile

</h2>



<div class="row justify-content-center mt-4">


    <div class="col-lg-8">


        <div class="card shadow-sm">


            <div class="card-header">


                <h5 class="mb-0">

                    Staff Details

                </h5>


            </div>



            <div class="card-body">


                <form method="POST">


                    <div class="mb-3">


                        <label class="form-label">

                            Name

                        </label>


                        <input
                            type="text"
                            name="staff_name"
                            class="form-control"

                            value="{{ staff.staff_name }}"


                            required>


                    </div>





                    <div class="mb-3">


                        <label class="form-label">

                            Email

                        </label>


                        <input
                            type="email"
                            class="form-control"

                            value="{{ current_user.email }}"


                            disabled>


                        <small class="text-muted">

                            Email cannot be changed.

                        </small>


                    </div>





                    <div class="mb-4">


                        <label class="form-label">

                            Contact

                        </label>


                        <input
                            type="text"
                            name="staff_contact"
                            class="form-control"

                            value="{{ staff.staff_contact }}">


                    </div>





                    <div class="text-end">


                        <button
                            type="submit"

                            class="btn btn-primary">


                            Update Profile


                        </button>


                    </div>



                </form>


            </div>


        </div>


    </div>


</div>


{% endblock %}
