<!DOCTYPE html>
<html lang="en" class="sidebar-collapsed">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384
	sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
	
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
	
	<link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
	
	<title>
		{% block title %}
		Staff
		{% endblock %}
	</title>
	
</head>
<body>

	<nav class="navbar border-bottom shadow-sm bg-body-tertiary d-flex justify-content-start">

			<button id="sidebar" class="btn d-none d-lg-block ms-2">
				
				<i class="bi bi-list"></i>
				
			</button>
	
			<a class="navbar-brand ms-2" href="{{ url_for('staff.dashboard') }}">
				<span>TREKO</span>
				<span class="d-none d-lg-inline"> - Your Trekking Buddy</span>
			</a>
			
			<div class="ms-auto me-3 d-none d-lg-block">
				<a class="btn btn-danger auth-btn" href="{{url_for('auth.logout')}}">Logout</a>
			</div>
			
			<button class="btn ms-auto d-lg-none" data-bs-toggle="offcanvas" data-bs-target="#mobile-sidebar">
				<i class="bi bi-list"></i>
			</button>
			
			<div id="mobile-sidebar" class="offcanvas offcanvas-end d-lg-none">
				
				<div class="offcanvas-header">
					
					<h5 class="offcanvas-title"> Staff Menu </h5>
					
					<button type="button" class="btn-close" data-bs-dismiss="offcanvas"></button>
				</div>
				
				<div class="offcanvas-body d-flex flex-column gap-4">
					
					<a class="nav-link" href="{{ url_for('staff.dashboard') }}"> 
						<i class="bi bi-house-door fs-4 me-2"></i>
						<span class="fs-5"> Dashboard </span>
					</a>

					<a class="nav-link" href="{{ url_for('staff.profile') }}">
						<i class="bi bi-person-circle fs-4 me-2"></i>
						<span class="fs-5"> My Profile </span>
					</a>
					
					<a class="btn btn-danger auth-btn mt-auto" href="{{ url_for('auth.logout') }}">
						<i class="bi bi-arrow-left"></i>
						Logout
					</a>
						
					
				</div>
				
			</div>

	</nav>
	
	<div class="container-fluid">
		<div class="row">
		
			<div class="col-auto min-vh-100 bg-light d-none d-lg-block">
				<div id="sidebar" class="staff-sidebar">

					<div class="d-flex flex-column gap-4 mt-2">
					
						<a class="nav-link sidebar-item" href="{{ url_for('staff.dashboard') }}"> 
							<i class="bi bi-house-door fs-4 me-2"></i>
							<span class="fs-5"> Dashboard </span>
						</a>

						<a class="nav-link sidebar-item" href="{{ url_for('staff.profile') }}">
							<i class="bi bi-person-circle fs-4 me-2"></i>
							<span class="fs-5"> My Profile </span>
						</a>
						
					</div>
					
				</div>
			</div>
			
			<div class="col min-vh-100">

				{% block main_content %}
				
				{% endblock %}
				
			</div>
			
		</div>
	</div>	

	
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
	
	<script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
