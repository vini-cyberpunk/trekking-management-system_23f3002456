{% extends "admin/admin_base.html" %}

{% block title %}
Edit Trek
{% endblock %}

{% block main_content %}

{% set lock_details = trek.status in ['started','completed','open','closed'] %}

<h2>Edit Trek</h2>

<div class="card shadow-sm mt-3">
    <div class="card-body">

        <form method="POST">

            <div class="row g-3">

                <div class="col-md-6">
                    <label class="form-label">Trek Name</label>
                    <input
                        type="text"
                        name="trek_name"
                        class="form-control"
                        value="{{ trek.trek_name }}"
                        {% if lock_details %}disabled{% endif %}
                        required>
                </div>

                <div class="col-md-6">
                    <label class="form-label">Location</label>
                    <input
                        type="text"
                        name="trek_location"
                        class="form-control"
                        value="{{ trek.trek_location }}"
                        {% if lock_details %}disabled{% endif %}
                        required>
                </div>

                <div class="col-md-4">
                    <label class="form-label">Difficulty</label>

                    <select
                        name="difficulty"
                        class="form-select"
                        {% if lock_details %}disabled{% endif %}
                        required>

                        <option value="easy"
                            {% if trek.difficulty=="easy" %}selected{% endif %}>
                            Easy
                        </option>

                        <option value="moderate"
                            {% if trek.difficulty=="moderate" %}selected{% endif %}>
                            Moderate
                        </option>

                        <option value="hard"
                            {% if trek.difficulty=="hard" %}selected{% endif %}>
                            Hard
                        </option>

                    </select>
                </div>

                <div class="col-md-4">
                    <label class="form-label">Duration (Days)</label>
                    <input
                        type="number"
                        name="duration"
                        class="form-control"
                        min="1"
                        value="{{ trek.duration }}"
                        {% if lock_details %}disabled{% endif %}
                        required>
                </div>

                <div class="col-md-4">
                    <label class="form-label">Available Slots</label>
                    <input
                        type="number"
                        name="available_slots"
                        class="form-control"
                        min="1"
                        value="{{ trek.available_slots }}"
                        {% if trek.status in ["started", "completed"] %}disabled{% endif %}
                        required>
                </div>

                <div class="col-md-6">
                    <label class="form-label">Start Date</label>
                    <input
                        type="date"
                        name="start_date"
                        class="form-control"
                        value="{{ trek.start_date }}"
                        {% if lock_details %}disabled{% endif %}
                        required>
                </div>

                <div class="col-md-6">
                    <label class="form-label">End Date</label>
                    <input
                        type="date"
                        name="end_date"
                        class="form-control"
                        value="{{ trek.end_date }}"
                        {% if lock_details %}disabled{% endif %}
                        required>
                </div>

                <div class="col-md-6">
                    <label class="form-label">Assign Staff</label>

                    <select
                        name="assigned_staff_id"
                        class="form-select"
                        {% if trek.status == "completed" %}disabled{% endif %}>

                        <option value="">Unassigned</option>

                        {% for s in staff %}

                        <option
                            value="{{ s.staff_id }}"
                            {% if trek.assigned_staff_id == s.staff_id %}selected{% endif %}>

                            {{ s.staff_name }}

                        </option>

                        {% endfor %}

                    </select>
                </div>

                <div class="col-md-6">
                    <label class="form-label">Status</label>

                    <select
                        name="status"
                        class="form-select">
                        
                        {% if trek.status=="approved" %}

                        <option value="approved"
                            {% if trek.status=="approved" %}selected{% endif %}>
                            Approved
                        </option>

                        <option value="open"
                            {% if trek.status=="open" %}selected{% endif %}>
                            Open
                        </option>
                        
                        {% elif trek.status=="open" %}

                        <option value="open"
                            {% if trek.status=="open" %}selected{% endif %}>
                            Open
                        </option>

                        <option value="closed"
                            {% if trek.status=="closed" %}selected{% endif %}>
                            Closed
                        </option>
                        
                        {% elif trek.status=="closed" %}
                        
                        <option value="open"
                            {% if trek.status=="open" %}selected{% endif %}>
                            Open
                        </option>
                        
                        <option value="closed"
                            {% if trek.status=="closed" %}selected{% endif %}>
                            Closed
                        </option>
                        
                        <option value="started"
                            {% if trek.status=="started" %}selected{% endif %}>
                            Started
                        </option>
                        
                        {% elif trek.status=="started" %}
                        
                        <option value="started"
                            {% if trek.status=="started" %}selected{% endif %}>
                            Started
                        </option>
                        
                        <option value="completed"
                            {% if trek.status=="completed" %}selected{% endif %}>
                            Completed
                        </option>
                        
                        {% endif %}

                    </select>
                </div>

            </div>

            <div class="mt-4 text-end">

                <a
                    href="{{ next_page }}"
                    class="btn btn-secondary">

                    Cancel

                </a>

                <button
                    type="submit"
                    class="btn btn-primary">

                    Save Changes

                </button>

            </div>

        </form>

    </div>
</div>

{% endblock %}
```
